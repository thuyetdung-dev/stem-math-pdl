<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Math Illustrator</title>
    <style>
        :root {
            --primary-green: #2e7d32;
            --bg-color: #f4f7f6;
            --panel-bg: #ffffff;
            --text-main: #333;
            --text-muted: #666;
            --border-color: #e0e0e0;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; color: var(--text-main); }
        .header { display: flex; align-items: center; margin-bottom: 20px; }
        .header-icon { background-color: #4caf50; color: white; padding: 10px; border-radius: 8px; margin-right: 15px; font-size: 24px; }
        .header-title h1 { margin: 0; font-size: 22px; color: #1a1a1a; }
        .header-title p { margin: 0; font-size: 14px; color: var(--primary-green); font-weight: 600; }
        .container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .panel { background: var(--panel-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); flex: 1; }
        .left-panel { flex: 0 0 400px; display: flex; flex-direction: column; }
        .right-panel { flex: 1; display: flex; flex-direction: column; }
        .section-title { font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; display: flex; justify-content: space-between; text-transform: uppercase; }
        textarea { width: 100%; height: 150px; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; font-family: inherit; font-size: 14px; resize: none; box-sizing: border-box; margin-bottom: 20px; }
        .btn-generate { background-color: #1a237e; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; display: flex; justify-content: center; gap: 10px; }
        .image-container { flex: 1; border: 1px solid var(--border-color); border-radius: 8px; background-color: #f9f9f9; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; overflow: hidden; min-height: 400px; padding: 10px; }
        .image-container img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .log-box { margin-top: 15px; padding: 10px; background: #e3f2fd; color: #0d47a1; font-size: 12px; border-radius: 6px; text-align: left; display: none; }
        
        /* Cập nhật giao diện Module API */
        .settings-panel { background: #f8f9fa; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .input-field { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: inherit; margin-bottom: 5px; }
        .flex-row { display: flex; gap: 10px; align-items: center; }
        .select-field { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; font-size: 14px; }
        .btn-scan { padding: 10px 15px; background: white; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; font-weight: bold; color: #333; display: flex; align-items: center; gap: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-icon">✨</div>
        <div class="header-title">
            <h1>AI Math Illustrator</h1>
            <p>TRANG WEB TẠO GIÁO CỤ TRỰC QUAN</p>
        </div>
    </div>

    <div class="container">
        <div class="panel left-panel">
            
            <!-- MODULE TÙY CHỌN NÂNG CAO -->
            <div class="settings-panel">
                <div class="section-title"><span>⚙️ TÙY CHỌN NÂNG CAO (API KEY)</span></div>
                
                <div style="margin-bottom: 12px;">
                    <input type="password" id="user-api-key" class="input-field" placeholder="Nhập API Key của bạn (tùy chọn)...">
                    <small style="color: #666; font-size: 11px;">* Nếu để trống, hệ thống sẽ dùng API Key mặc định của máy chủ.</small>
                </div>

                <div class="flex-row">
                    <select id="ai-model-select" class="select-field">
                        <option value="gemini-1.5-flash-latest">gemini-1.5-flash-latest (Mặc định)</option>
                    </select>
                    <button type="button" id="btn-scan-models" class="btn-scan" onclick="scanModels()">
                        🔄 Dò lại
                    </button>
                </div>
                <div id="scan-log" style="font-size: 12px; margin-top: 8px; display: none;"></div>
            </div>

            <!-- NHẬP ĐỀ TOÁN -->
            <div class="section-title"><span>📖 1. NHẬP ĐỀ TOÁN VÀO ĐÂY</span></div>
            <textarea id="math-input">Bể 2m, 3m, 2m chứa đầy nước. Bạn Đạt lấy nước ra bởi cái gáo hình trụ cao 15cm, bán kính 10cm. Múc ra 30 gáo mỗi ngày.</textarea>
            
            <button class="btn-generate" onclick="generateImage()" id="gen-btn">
                🪄 Tạo hình minh họa ngay
            </button>
            <div id="log" class="log-box"></div>
        </div>

        <div class="panel right-panel">
            <div class="section-title"><span>HÌNH MINH HỌA TRỰC QUAN</span></div>
            <div class="image-container" id="image-output">
                <p style="color: #999;">Nhấn nút bên trái để AI bắt đầu vẽ...</p>
            </div>
        </div>
    </div>

    <script>
        async function scanModels() {
            const apiKey = document.getElementById('user-api-key').value.trim();
            const modelSelect = document.getElementById('ai-model-select');
            const scanLog = document.getElementById('scan-log');
            const scanBtn = document.getElementById('btn-scan-models');

            scanBtn.innerHTML = "⏳ Đang dò...";
            scanBtn.disabled = true;
            scanLog.style.display = "block";
            scanLog.style.color = "#000";
            scanLog.innerText = "Đang kết nối tới máy chủ Google...";

            try {
                const response = await fetch('/api/scan-models', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ api_key: apiKey })
                });

                const data = await response.json();

                if (data.models) {
                    modelSelect.innerHTML = '';
                    data.models.forEach(model => {
                        const option = document.createElement('option');
                        option.value = model;
                        option.textContent = model;
                        
                        // Tự động ưu tiên chọn mô hình "flash" thay vì "pro" để xử lý cho nhanh
                        if(model.includes("gemini-1.5-flash") && !model.includes("8b")) {
                            option.selected = true;
                        }
                        modelSelect.appendChild(option);
                    });
                    scanLog.style.color = "green";
                    scanLog.innerText = `✔️ Đã tìm thấy ${data.models.length} mô hình khả dụng.`;
                } else {
                    scanLog.style.color = "red";
                    scanLog.innerText = `❌ Lỗi: ${data.error}`;
                }
            } catch (err) {
                scanLog.style.color = "red";
                scanLog.innerText = "❌ Lỗi kết nối mạng khi tải danh sách mô hình.";
            }

            scanBtn.innerHTML = "🔄 Dò lại";
            scanBtn.disabled = false;
        }

        async function generateImage() {
            const mathInput = document.getElementById('math-input').value;
            const apiKey = document.getElementById('user-api-key').value.trim();
            const selectedModel = document.getElementById('ai-model-select').value;
            
            const output = document.getElementById('image-output');
            const btn = document.getElementById('gen-btn');
            const log = document.getElementById('log');

            if(!mathInput.trim()) return alert("Vui lòng nhập đề toán!");

            btn.innerHTML = "⏳ Đang xử lý... (vui lòng đợi)";
            btn.style.backgroundColor = "#5c6bc0";
            btn.disabled = true;
            output.innerHTML = '<p style="color: #666; font-size:18px;">🤖 Máy chủ AI đang đọc đề và vẽ hình...<br><br><small>Quá trình này có thể mất 5 - 10 giây</small></p>';
            log.style.display = "none";

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        text: mathInput,
                        api_key: apiKey,
                        model: selectedModel
                    })
                });

                const data = await response.json();

                if(data.image_url) {
                    output.innerHTML = `<img src="${data.image_url}" alt="Generated Image">`;
                    log.style.display = "block";
                    log.innerHTML = `<b>Prompt AI đã sinh ra:</b><br>${data.prompt}`;
                } else {
                    output.innerHTML = `<p style="color: red;">❌ Lỗi: ${data.error}</p>`;
                }
            } catch (err) {
                output.innerHTML = `<p style="color: red;">❌ Lỗi kết nối mạng.</p>`;
            }

            btn.innerHTML = "🪄 Tạo hình minh họa ngay";
            btn.style.backgroundColor = "#1a237e";
            btn.disabled = false;
        }
    </script>
</body>
</html>
